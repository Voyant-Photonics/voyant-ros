/**:
  ros__parameters:
    ## Live node parameters
    # Defaults target a Carbon sensor on a local network:
    # - "0.0.0.0:5678": Local binding address and port (Carbon default)
    # - "239.255.48.84": Multicast group the receiver joins (the sensor replies via unicast by default)
    # - "192.168.1.100": Host network interface IP on the sensor's subnet
    #
    # For loopback testing against the Carbon simulator, set interface_address
    # to "127.0.0.1".
    binding_address: '0.0.0.0:5678'
    multicast_group: '239.255.48.84'
    interface_address: '192.168.1.100'
    # How the sensor delivers its push stream:
    # - "unicast" (default): the sensor replies only to this client; robust even on a multi-homed host
    # - "multicast": the sensor streams to the group above so other clients can share the sensor
    stream_transport: 'unicast'
    # Observer-only mode: passively receive the stream without driving the sensor (no SDL, time-sync,
    # or comms-health). Set true when another (primary) client already owns the sensor; that primary
    # must use "multicast" so this node can receive the shared stream. Exactly one primary per sensor.
    observer_only: false

    ## Shared parameters
    # timestamp_mode[optional]
    # - 0 = TIME_FROM_SENSOR
    # - 1 = TIME_FROM_ROS
    timestamp_mode: 0

    # Include invalid returns (with their drop_reason) instead of valid points only.
    # Live: runs the client in diagnostic mode; conversion: keeps a recording's invalid points.
    diagnostic_mode: false

    ## The below params are shared with the bin_to_mcap conversion
    frame_id: 'voyant_sensor'
    bin_input: '' # Path to your .vynt recording
    mcap_output: '' # Desired output path
    storage_id: 'mcap' # sqlite3/mcap
    serialization_format: 'cdr'
    topic_name: '/point_cloud' # Changing this will break the foxglove multi colormap visualization,
