/**:
  ros__parameters:
    ## Live node parameters
    # Defaults target a Carbon sensor on a local network:
    # - "0.0.0.0:5678": Local binding address and port (Carbon default)
    # - "239.255.48.84": Multicast group address (must match the sensor's push destination)
    # - "192.168.1.100": Host network interface IP on the sensor's subnet
    #
    # For loopback testing against the Carbon simulator, set interface_address
    # to "127.0.0.1".
    binding_address: '0.0.0.0:5678'
    multicast_group: '239.255.48.84'
    interface_address: '192.168.1.100'

    ## Shared parameters
    # Point format selection
    # - 0 = UNKNOWN (will throw error)
    # - 1 = MDL_STANDARD (recommended) - x,y,z,v,snr,drop_reason,timestamp,index
    # - 2 = MDL_EXTENDED - adds calibrated_reflectance, noise_mean_estimate, min_ramp_snr, frame_index
    point_format: 1

    # timestamp_mode[optional]
    # - 0 = TIME_FROM_SENSOR
    # - 1 = TIME_FROM_ROS
    timestamp_mode: 0

    # Enable Single Point Noise filter (+ other filtering of invalid points)
    valid_only_filter: true

    ## The below params are shared with the bin_to_mcap conversion
    frame_id: 'voyant_sensor'
    bin_input: '' # Path to your bin file
    mcap_output: '' # Desired output path
    storage_id: 'mcap' # sqlite3/mcap
    serialization_format: 'cdr'
    topic_name: '/point_cloud' # Changing this will break the foxglove multi colormap visualization,
