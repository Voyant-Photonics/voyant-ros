name: Voyant ROS2 Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}

    strategy:
      fail-fast: false
      matrix:
        # iron dropped: reached EOL in November 2024.
        # rolling dropped: upstream packaging churn (e.g. inconsistent
        # message_filters / pcl_conversions imported-target exports against
        # std_msgs / rosidl_buffer) makes CI unreliable.
        # humble: Ubuntu 22.04 (jammy)   | jazzy:   Ubuntu 24.04 (noble)
        # kilted: Ubuntu 24.04 (noble)   | lyrical: Ubuntu 26.04 (resolute)
        ros_distro: [humble, jazzy, kilted, lyrical]
        rmw: [rmw_fastrtps_cpp, rmw_cyclonedds_cpp]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: |
          docker build .                                          \
            --build-arg ROS_DISTRO=${{ matrix.ros_distro }}       \
            --build-arg RMW_IMPLEMENTATION=${{ matrix.rmw }}  \
            --file Dockerfile                                     \
            --tag voyant-ros-${{ matrix.ros_distro }}-${{ matrix.rmw }}:latest
